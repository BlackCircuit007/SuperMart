<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed - LordTempsMart</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
    <div class="topbar-left">
        <a href="#" class="flag">EN English</a>
        <a href="index.html">Home</a>
        <a href="products.html">Shop</a>
    </div>
    <a href="#" class="flag">EN</a>
</div>

<header class="navbar">
    <div class="nav-row">
        <div style="display:flex;align-items:center;gap:12px;">
            <a href="index.html" class="brand"><span class="brand-mark">SHOP</span><span>LordTempsMart</span></a>
            <div class="nav-links" id="navLinks">
                <a href="index.html" class="nav-link">Home</a>
                <a href="products.html" class="nav-link">Shop</a>
                <a href="cart.html" class="nav-link">Cart</a>
            </div>
        </div>
        <div class="nav-actions">
            <a href="cart.html" class="nav-action">
                <span class="action-icon">CART</span>
                <span>Cart</span>
                <span class="badge" id="cart-count">0</span>
            </a>
            <a href="dashboard.html" class="nav-action" id="authAction">
                <span class="action-icon">USER</span>
                <span>Account</span>
            </a>
        </div>
    </div>
</header>

<main>
    <section class="thankyou">
        <div class="big">CHECK</div>
        <h1>Order Confirmed!</h1>
        <p>Thank you for shopping with LordTempsMart. Your order has been received and will be processed shortly.</p>
        <div class="order-ref" id="orderRef"></div>
        <p id="orderStatus" style="margin-top:12px;color:var(--c-text-secondary);"></p>
        <div class="hero-actions" style="justify-content:center;margin-top:24px;">
            <a href="products.html" class="primary-btn" style="background:var(--c-primary);color:#fff;">Continue Shopping</a>
            <a href="dashboard.html?tab=orders" class="secondary-btn" style="background:#f5f7f9;color:var(--c-text);border:1px solid var(--c-border);">View My Orders</a>
        </div>
    </section>
</main>

<footer class="site-footer">
    <div class="footer-bottom">
        <p>Copyright 2026 LordTempsMart. All rights reserved.</p>
    </div>
</footer>

<script src="js/api.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
window.addEventListener("DOMContentLoaded", function () {
    initTheme();
    initBackToTop();
    updateAuthUI();
    var params = new URLSearchParams(window.location.search);
    var ref = params.get("ref");
    var payment = params.get("payment");
    var el = document.getElementById("orderRef");
    if (el) {
        el.textContent = ref ? "Your order reference: " + ref : "Your order reference: TM" + Date.now().toString().slice(-8);
    }
    var statusEl = document.getElementById("orderStatus");
    async function refreshOrderStatus() {
        if (!ref || !statusEl || !isLoggedIn()) return;
        try {
            var orders = await apiGetMyOrders();
            var order = orders.find(function (item) { return item.order_ref === ref; });
            if (!order) return;
            if (order.payment_method === "cash") {
                statusEl.textContent = "Cash on delivery: you will pay when the order arrives. Delivery: " + ((Number(order.delivered) === 1 || order.status === "delivered") ? "Delivered" : "Not delivered yet") + ".";
            } else {
                statusEl.textContent = "Payment: " + (order.payment_status === "verified" ? "Paid" : "Awaiting verification") + ". Delivery: " + ((Number(order.delivered) === 1 || order.status === "delivered") ? "Delivered" : "Not delivered yet") + ". This page refreshes automatically while you wait.";
            }
        } catch (err) {
            statusEl.textContent = payment === "cash" ? "Cash payment will be verified on delivery." : "Your order is saved. Check My Orders for updates.";
        }
    }
    refreshOrderStatus();
    if (ref) window.setInterval(refreshOrderStatus, 15000);
});
</script>
</body>
</html>
