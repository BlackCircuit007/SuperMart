<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Loading…</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #ffffff 0%, #fff3ef 100%);
        font-family: 'Segoe UI', Arial, sans-serif;
        user-select: none;
        overflow: hidden;
    }
    .logo {
        width: 190px;
        height: 190px;
        border-radius: 42px;
        box-shadow: 0 18px 40px rgba(230, 46, 0, 0.28);
        animation: pop .6s cubic-bezier(.2,.9,.3,1.4);
    }
    h1 {
        margin-top: 26px;
        font-size: 30px;
        font-weight: 800;
        color: #e62e00;
        letter-spacing: .5px;
    }
    p.sub {
        margin-top: 6px;
        font-size: 13px;
        color: #b3543f;
    }
    .spinner {
        margin-top: 34px;
        width: 38px;
        height: 38px;
        border: 4px solid #ffd9cf;
        border-top-color: #ff3b20;
        border-radius: 50%;
        animation: spin .8s linear infinite;
    }
    .status { margin-top: 14px; font-size: 12px; color: #c98a7a; }
    body.error .spinner { display: none; }
    body.error .status { color: #d32f2f; font-weight: 600; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>
    <img class="logo" src="../frontend/icons/logo-1024.png" alt="LordTempsMart">
    <h1>LordTempsMart</h1>
    <p class="sub">Skin Care & Provisions Store</p>
    <div class="spinner"></div>
    <p class="status" id="status">Starting up…</p>
    <script>
        if (location.hash === '#error') {
            document.body.classList.add('error');
            document.getElementById('status').textContent =
                'Could not reach the store database. Check your internet connection and restart the app.';
        } else {
            var msgs = ['Starting up…', 'Connecting to the store…', 'Almost ready…'];
            var i = 0;
            setInterval(function () {
                i = (i + 1) % msgs.length;
                document.getElementById('status').textContent = msgs[i];
            }, 1400);
        }
    </script>
</body>
</html>
